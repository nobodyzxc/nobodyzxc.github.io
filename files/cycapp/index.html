<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cycle-lab | Strava Zip Upload Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .panel {
      position: absolute; z-index: 1000; top: 12px; left: 12px; width: min(335px, calc(100vw - 24px));
      background: rgba(255,255,255,0.96); border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
    .row label { min-width: 90px; font-size: 13px; color: #111827; }
    .row input[type="range"] { flex: 1; }
    .meta { font-size: 12px; color: #374151; margin-top: 6px; line-height: 1.4; }
    .title { font-weight: 700; margin-bottom: 8px; }
    .btn { border: 1px solid #9ca3af; background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .muted { color: #6b7280; font-size: 12px; }
    .help-link { margin-top: 8px; }
    .spoiler-toggle {
      margin-top: 8px;
      background: transparent;
      border: 0;
      padding: 0;
      cursor: pointer;
      color: #374151;
      font-size: 13px;
    }
    .spoiler-caret {
      display: inline-block;
      margin-left: 6px;
      transition: transform 0.15s ease;
    }
    .spoiler-toggle.open .spoiler-caret { transform: rotate(180deg); }
    .advanced-panel { display: none; margin-top: 6px; }
    .advanced-panel.open { display: block; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-card {
      width: min(900px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      box-shadow: 0 16px 40px rgba(0,0,0,0.2);
      padding: 14px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .modal-title { font-weight: 700; }
    .help-step { margin-top: 10px; }
    .help-step strong { color: #111827; }
    .help-step img {
      display: block;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin-top: 6px;
    }
    .warn {
      margin-top: 10px;
      color: #7f1d1d;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
    }
    .share-overlay {
      position: fixed;
      inset: 0;
      z-index: 2100;
      display: none;
      pointer-events: none;
    }
    .share-overlay.open { display: block; }
    .share-zones {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .share-zone {
      position: absolute;
      pointer-events: auto;
    }
    .share-zone.mid { background: rgba(0,0,0,0.48); }
    .share-zone.deep { background: rgba(0,0,0,0.72); }
    .share-mask {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .share-frame {
      position: absolute;
      border: 2px solid rgba(255,255,255,0.95);
      border-radius: 10px;
      pointer-events: none;
      cursor: default;
      overflow: hidden;
    }
    .share-text-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .share-text-object {
      position: absolute;
      transform: translate(-50%, -50%);
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      white-space: pre-wrap;
      line-height: 1.25;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
      touch-action: none;
      padding: 2px 4px;
      border-radius: 6px;
    }
    .share-text-object.selected {
      outline: 1px dashed rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.18);
    }
    .share-text-object.dragging { cursor: grabbing; }
    .share-frame.add-mode { cursor: crosshair; pointer-events: auto; }
    .share-handle {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(17,24,39,0.7);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      pointer-events: auto;
    }
    .share-handle.nw { left: -7px; top: -7px; cursor: nwse-resize; }
    .share-handle.ne { right: -7px; top: -7px; cursor: nesw-resize; }
    .share-handle.sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
    .share-handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }
    .share-handle.n { left: 50%; top: -7px; transform: translateX(-50%); cursor: ns-resize; }
    .share-handle.s { left: 50%; bottom: -7px; transform: translateX(-50%); cursor: ns-resize; }
    .share-handle.w { left: -7px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
    .share-handle.e { right: -7px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
    .share-controls {
      position: absolute;
      right: 12px;
      top: 12px;
      width: min(184px, calc(100vw - 24px));
      background: rgba(255,255,255,0.97);
      border: 1px solid #d1d5db;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      padding: 10px 12px;
      pointer-events: auto;
    }
    .share-controls .row { margin: 6px 0; }
    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 6px 0 8px;
    }
    .preset-btn {
      border: 1px solid #9ca3af;
      background: #fff;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .preset-btn.active {
      border-color: #0f766e;
      background: #ccfbf1;
      color: #134e4a;
      font-weight: 600;
    }
    .share-controls input[type="text"], .share-controls select, .share-controls input[type="color"], .share-controls input[type="range"] {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 6px 8px;
      font: inherit;
      width: 100%;
      box-sizing: border-box;
    }
    .share-controls input[type="color"] { padding: 2px; height: 34px; }
    .share-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .small { font-size: 12px; color: #4b5563; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <div class="title">Strava Zip Upload Map (GPX)</div>
    <div class="row">
      <label for="zip-input">Strava Zip</label>
      <input id="zip-input" type="file" accept=".zip" />
    </div>
    <div class="row">
      <label></label>
      <button id="demo-btn" class="btn" type="button">載入 Demo</button>
    </div>
    <div class="meta" id="meta">尚未載入。選擇 Strava export zip 後按「繪圖」。</div>
    <div class="muted">目前支援 zip 內 `activities/*.gpx|*.fit` 與 `*.gz`。</div>
    <div class="help-link">
      <button id="help-btn" class="btn" type="button">Strava Zip 下載教學</button>
      <button id="share-btn" class="btn" type="button">分享截圖</button>
    </div>
    <button id="advanced-toggle" class="spoiler-toggle" type="button">
      進階地圖設定<span class="spoiler-caret">▼</span>
    </button>
    <div id="advanced-panel" class="advanced-panel">
      <div class="row">
        <label>路線透明度</label>
        <input id="route-opacity" type="range" min="0.05" max="0.8" step="0.01" value="0.4" />
        <span id="route-opacity-val">0.40</span>
      </div>
      <div class="row">
        <label>路線線寬</label>
        <input id="route-weight" type="range" min="1" max="4" step="0.1" value="2.2" />
        <span id="route-weight-val">2.2</span>
      </div>
      <div class="row">
        <label>熱區底亮度</label>
        <input id="heat-min" type="range" min="0.08" max="0.85" step="0.01" value="0.65" />
        <span id="heat-min-val">0.65</span>
      </div>
      <div class="row">
        <label>熱區增益</label>
        <input id="heat-gain" type="range" min="0.6" max="3" step="0.05" value="1.85" />
        <span id="heat-gain-val">1.85</span>
      </div>
      <div class="row">
        <label>起點隱藏距離</label>
        <input id="start-hide-km" type="range" min="0" max="5" step="0.1" value="1.0" />
        <span id="start-hide-km-val">1.0 km</span>
      </div>
      <div class="row">
        <label>終點隱藏距離</label>
        <input id="end-hide-km" type="range" min="0" max="5" step="0.1" value="1.0" />
        <span id="end-hide-km-val">1.0 km</span>
      </div>
      <div class="row">
        <label>活動類型</label>
        <select id="activity-type-filter">
          <option value="all" selected>All</option>
          <option value="cycling">Cycling</option>
          <option value="run">Run</option>
        </select>
      </div>
    </div>
  </div>

  <div id="help-modal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="modal-header">
        <div id="help-title" class="modal-title">如何下載 Strava 匯出 Zip</div>
        <button id="help-close-btn" class="btn" type="button">關閉</button>
      </div>
      <div class="help-step">
        <strong>Step 1.</strong>
        進入
        <a href="https://www.strava.com/account" target="_blank" rel="noopener noreferrer">Strava 我的帳戶</a>，
        拉到最下面的「下載或刪除帳戶」，點「開始使用」。
        <img src="./help1.png" alt="Strava account page: download or delete account" />
      </div>
      <div class="help-step">
        <strong>Step 2.</strong>
        在第二步按「下載要求」進行 Strava 資料下載。
        <img src="./help2.webp" alt="Strava data export request step" />
      </div>
      <div class="warn">
        只需要下載資料，<strong>不要刪除帳號</strong>。
      </div>
    </div>
  </div>

  <div id="share-overlay" class="share-overlay" aria-hidden="true">
    <div id="share-zones" class="share-zones">
      <div id="share-deep-top" class="share-zone deep"></div>
      <div id="share-deep-right" class="share-zone deep"></div>
      <div id="share-deep-bottom" class="share-zone deep"></div>
      <div id="share-deep-left" class="share-zone deep"></div>
      <div id="share-mid-top" class="share-zone mid"></div>
      <div id="share-mid-right" class="share-zone mid"></div>
      <div id="share-mid-bottom" class="share-zone mid"></div>
      <div id="share-mid-left" class="share-zone mid"></div>
    </div>
    <div class="share-mask">
      <div id="share-frame" class="share-frame">
        <div id="share-text-layer" class="share-text-layer"></div>
        <div class="share-handle nw" data-dir="nw"></div>
        <div class="share-handle ne" data-dir="ne"></div>
        <div class="share-handle sw" data-dir="sw"></div>
        <div class="share-handle se" data-dir="se"></div>
        <div class="share-handle n" data-dir="n"></div>
        <div class="share-handle s" data-dir="s"></div>
        <div class="share-handle w" data-dir="w"></div>
        <div class="share-handle e" data-dir="e"></div>
      </div>
    </div>
    <div class="share-controls">
      <div class="title">分享截圖</div>
      <div class="row">
        <label>版型</label>
      </div>
      <div class="preset-row">
        <button class="preset-btn active" type="button" data-preset="insta-post">Post</button>
        <button class="preset-btn" type="button" data-preset="insta-story">Story</button>
        <button class="preset-btn" type="button" data-preset="square">Square</button>
        <button class="preset-btn" type="button" data-preset="landscape">Landscape</button>
        <button class="preset-btn" type="button" data-preset="custom">Custom</button>
      </div>
      <div class="row">
        <label>文字物件</label>
      </div>
      <div class="share-actions">
        <button id="share-add-text-btn" class="btn" type="button">+ 新增文字</button>
        <button id="share-edit-text-btn" class="btn" type="button">編輯文字</button>
        <button id="share-delete-text-btn" class="btn" type="button">刪除文字</button>
      </div>
      <div class="row">
        <label>字色</label>
        <input id="share-text-color" type="color" value="#ffffff" />
      </div>
      <div class="row">
        <label>字級</label>
        <input id="share-text-size" type="range" min="12" max="72" step="1" value="24" />
      </div>
      <div class="row">
        <label>粗細</label>
        <select id="share-text-weight">
          <option value="400">Regular</option>
          <option value="600">SemiBold</option>
          <option value="700" selected>Bold</option>
          <option value="800">ExtraBold</option>
        </select>
      </div>
      <div class="row">
        <label>字體</label>
        <select id="share-text-family">
          <option value="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" selected>Sans</option>
          <option value="Georgia,'Times New Roman',serif">Serif</option>
          <option value="'Courier New',Courier,monospace">Monospace</option>
        </select>
      </div>
      <div class="row">
        <label>旋轉</label>
        <input id="share-text-rotate" type="range" min="-180" max="180" step="1" value="0" />
      </div>
      <div class="small">按「下載截圖」會輸出透明框範圍內的地圖並疊上這段文字。</div>
      <div class="share-actions">
        <button id="share-download-btn" class="btn" type="button">下載截圖</button>
        <button id="share-close-btn" class="btn" type="button">關閉</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const map = L.map('map', { preferCanvas: true }).setView([23.8, 121], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors',
      crossOrigin: true,
    }).addTo(map);

    map.createPane('heatPane');
    map.createPane('routePane');
    map.getPane('heatPane').style.zIndex = '420';
    map.getPane('routePane').style.zIndex = '430';

    let routeOpacity = 0.4;
    let routeWeight = 2.2;
    let heatMin = 0.65;
    let heatGain = 1.85;
    let startHideKm = 1.0;
    let endHideKm = 1.0;
    let activityTypeFilter = 'all';

    const routeLayer = L.geoJSON([], {
      pane: 'routePane',
      style: { color: '#f97316', weight: routeWeight, opacity: routeOpacity },
      onEachFeature: (feature, layer) => {
        const p = feature.properties || {};
        const dateText = p.date || 'N/A';
        const distText = Number.isFinite(p.distanceKm) ? `${p.distanceKm.toFixed(2)} km` : 'N/A';
        const elevGainText = Number.isFinite(p.elevGainM) ? `${p.elevGainM.toFixed(0)} m` : 'N/A';
        const elevHighText = Number.isFinite(p.elevHighM) ? `${p.elevHighM.toFixed(0)} m` : 'N/A';
        const movingText = formatSeconds(p.movingSec);
        const elapsedText = formatSeconds(p.elapsedSec);
        const nameText = p.name || 'Unnamed';
        layer.bindTooltip(
          `<strong>${nameText}</strong><br/>日期: ${dateText}<br/>距離: ${distText}<br/>總爬升: ${elevGainText}<br/>最高海拔: ${elevHighText}<br/>移動時間: ${movingText}<br/>總耗時: ${elapsedText}`,
          { sticky: true, direction: 'top', opacity: 0.95 }
        );
      }
    }).addTo(map);

    const heatLayer = L.heatLayer([], {
      pane: 'heatPane',
      radius: 12,
      blur: 18,
      minOpacity: heatMin,
      maxZoom: 14,
      gradient: {
        0.15: '#5eead4',
        0.35: '#2dd4bf',
        0.6: '#14b8a6',
        0.8: '#0f766e',
        1.0: '#164e63'
      }
    }).addTo(map);

    const el = (id) => document.getElementById(id);
    const metaEl = el('meta');
    const advancedToggleEl = el('advanced-toggle');
    const advancedPanelEl = el('advanced-panel');
    const helpModalEl = el('help-modal');
    const shareOverlayEl = el('share-overlay');
    const shareZonesEl = el('share-zones');
    const shareDeepTopEl = el('share-deep-top');
    const shareDeepRightEl = el('share-deep-right');
    const shareDeepBottomEl = el('share-deep-bottom');
    const shareDeepLeftEl = el('share-deep-left');
    const shareMidTopEl = el('share-mid-top');
    const shareMidRightEl = el('share-mid-right');
    const shareMidBottomEl = el('share-mid-bottom');
    const shareMidLeftEl = el('share-mid-left');
    const shareFrameEl = el('share-frame');
    const shareTextLayerEl = el('share-text-layer');
    let lastZipBuffer = null;
    let lastZipLabel = '';
    const sharePresetRatios = {
      'insta-post': 4 / 5,
      'insta-story': 9 / 16,
      'square': 1,
      'landscape': 16 / 9,
    };
    let sharePreset = 'insta-post';
    let shareRect = { x: 0, y: 0, w: 0, h: 0 };
    let shareResize = null;
    let shareTexts = [];
    let shareSelectedTextId = null;
    let shareTextDrag = null;
    let shareAddMode = false;
    let shareTextIdSeq = 1;
    shareZonesEl.style.display = 'none';

    const updateLabels = () => {
      el('route-opacity-val').textContent = routeOpacity.toFixed(2);
      el('route-weight-val').textContent = routeWeight.toFixed(1);
      el('heat-min-val').textContent = heatMin.toFixed(2);
      el('heat-gain-val').textContent = heatGain.toFixed(2);
      el('start-hide-km-val').textContent = `${startHideKm.toFixed(1)} km`;
      el('end-hide-km-val').textContent = `${endHideKm.toFixed(1)} km`;
    };

    const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

    const clampShareRect = (r) => {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const minW = 180;
      const minH = 120;
      const w = clamp(r.w, minW, vw);
      const h = clamp(r.h, minH, vh);
      const x = clamp(r.x, 0, vw - w);
      const y = clamp(r.y, 0, vh - h);
      return { x, y, w, h };
    };

    const setPresetActive = (preset) => {
      sharePreset = preset;
      document.querySelectorAll('.preset-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.preset === preset);
      });
    };

    const fitRectByRatio = (ratio) => {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const maxW = vw * 0.88;
      const maxH = vh * 0.82;
      let w = maxW;
      let h = w / ratio;
      if (h > maxH) {
        h = maxH;
        w = h * ratio;
      }
      return {
        x: (vw - w) / 2,
        y: (vh - h) / 2,
        w,
        h,
      };
    };

    const updateShareFrame = () => {
      shareRect = clampShareRect(shareRect);
      shareRect.x = (window.innerWidth - shareRect.w) / 2;
      shareRect.y = (window.innerHeight - shareRect.h) / 2;
      shareFrameEl.style.left = `${shareRect.x}px`;
      shareFrameEl.style.top = `${shareRect.y}px`;
      shareFrameEl.style.width = `${shareRect.w}px`;
      shareFrameEl.style.height = `${shareRect.h}px`;
      updateShareZones();
      renderShareTexts();
    };

    const placeZone = (elNode, left, top, width, height) => {
      const w = Math.max(0, width);
      const h = Math.max(0, height);
      elNode.style.left = `${Math.max(0, left)}px`;
      elNode.style.top = `${Math.max(0, top)}px`;
      elNode.style.width = `${w}px`;
      elNode.style.height = `${h}px`;
      elNode.style.display = (w > 0 && h > 0) ? 'block' : 'none';
    };

    const updateShareZones = () => {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const x1 = shareRect.x;
      const y1 = shareRect.y;
      const x2 = shareRect.x + shareRect.w;
      const y2 = shareRect.y + shareRect.h;
      const ring = 130;
      const mx1 = Math.max(0, x1 - ring);
      const my1 = Math.max(0, y1 - ring);
      const mx2 = Math.min(vw, x2 + ring);
      const my2 = Math.min(vh, y2 + ring);

      placeZone(shareDeepTopEl, 0, 0, vw, my1);
      placeZone(shareDeepBottomEl, 0, my2, vw, vh - my2);
      placeZone(shareDeepLeftEl, 0, my1, mx1, my2 - my1);
      placeZone(shareDeepRightEl, mx2, my1, vw - mx2, my2 - my1);

      placeZone(shareMidTopEl, mx1, my1, mx2 - mx1, y1 - my1);
      placeZone(shareMidBottomEl, mx1, y2, mx2 - mx1, my2 - y2);
      placeZone(shareMidLeftEl, mx1, y1, x1 - mx1, y2 - y1);

    const samplePoints = (points, step) => {
      if (step <= 1) return points;
      const out = [];
      for (let i = 0; i < points.length; i += step) out.push(points[i]);
      if (points.length && out[out.length - 1] !== points[points.length - 1]) out.push(points[points.length - 1]);
      return out;
    };

    const parseGpxText = (text) => {
      const doc = new DOMParser().parseFromString(text, 'application/xml');
      const pts = [];
      const a = Array.from(doc.getElementsByTagName('trkpt'));
      const b = Array.from(doc.getElementsByTagNameNS('*', 'trkpt'));
      const trkpts = [...a];
      b.forEach((n) => { if (!trkpts.includes(n)) trkpts.push(n); });
      for (let i = 0; i < trkpts.length; i += 1) {
        const n = trkpts[i];
        const lat = Number(n.getAttribute('lat'));
        const lon = Number(n.getAttribute('lon'));
        if (Number.isFinite(lat) && Number.isFinite(lon)) pts.push([lat, lon]);
      }
      return pts;
    };

    const toRad = (v) => (v * Math.PI) / 180;
    const haversineMeters = (a, b) => {
      const R = 6371000;
      const dLat = toRad(b[0] - a[0]);
      const dLon = toRad(b[1] - a[1]);
      const lat1 = toRad(a[0]);
      const lat2 = toRad(b[0]);
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(x));
    };

    const trimStartByDistance = (points, km) => {
      const threshold = Math.max(0, km) * 1000;
      if (!threshold || points.length < 2) return points;
      let acc = 0;
      let idx = 0;
      while (idx + 1 < points.length && acc < threshold) {
        acc += haversineMeters(points[idx], points[idx + 1]);
        idx += 1;
      }
      const out = points.slice(idx);
      return out.length >= 2 ? out : [];
    };

    const trimEndByDistance = (points, km) => {
      const threshold = Math.max(0, km) * 1000;
      if (!threshold || points.length < 2) return points;
      let acc = 0;
      let idx = points.length - 1;
      while (idx - 1 >= 0 && acc < threshold) {
        acc += haversineMeters(points[idx], points[idx - 1]);
        idx -= 1;
      }
      const out = points.slice(0, idx + 1);
      return out.length >= 2 ? out : [];
    };

    const isCyclingType = (typeText) => {
      const t = String(typeText || '').toLowerCase();
      return t.includes('ride') || t.includes('cycle');
    };

    const isRunType = (typeText) => {
      const t = String(typeText || '').toLowerCase();
      return t.includes('run');
    };

    const parseCsvLine = (line) => {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i += 1) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current);
      return result;
    };

    const parseCsv = (text) => {
      const lines = text.split(/\r?\n/).filter(Boolean);
      if (!lines.length) return [];
      const headers = parseCsvLine(lines[0]);
      return lines.slice(1).map((line) => {
        const cols = parseCsvLine(line);
        const row = {};
        headers.forEach((h, idx) => { row[h] = cols[idx] ?? ''; });
        return row;
      });
    };

    const stemFromPath = (name) => {
      const base = name.split('/').pop() || name;
      return base.replace(/\.(gpx|fit)(\.gz)?$/i, '');
    };

    const buildMetaMaps = (rows) => {
      const byId = new Map();
      const byFilenameStem = new Map();
      rows.forEach((row) => {
        const id = String(row['Activity ID'] || '').trim();
        if (id) byId.set(id, row);
        const filename = String(row.Filename || '').trim();
        if (filename) byFilenameStem.set(stemFromPath(filename), row);
      });
      return { byId, byFilenameStem };
    };

    const fitSemicircleToDegrees = (value) => (value * 180) / 2147483648;
    const parseFitPoints = (u8) => {
      const points = [];
      if (!u8 || u8.length < 14) return points;
      const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
      const headerSize = dv.getUint8(0);
      if (headerSize < 12 || u8.length < headerSize + 2) return points;

      const dataSize = dv.getUint32(4, true);
      const dataStart = headerSize;
      const dataEnd = Math.min(u8.length, dataStart + dataSize);
      const definitions = new Map();
      let offset = dataStart;

      const readSint32 = (pos, littleEndian) => {
        if (pos + 4 > dataEnd) return null;
        return dv.getInt32(pos, littleEndian);
      };

      while (offset < dataEnd) {
        const header = dv.getUint8(offset);
        offset += 1;

        if (header & 0x80) {
          const localMsgType = (header >> 5) & 0x03;
          const def = definitions.get(localMsgType);
          if (!def) continue;

          let lat = null;
          let lon = null;
          for (const field of def.fields) {
            if (offset + field.size > dataEnd) { offset = dataEnd; break; }
            if (def.globalMsgNum === 20 && field.size === 4 && (field.num === 0 || field.num === 1)) {
              const value = readSint32(offset, def.littleEndian);
              if (value !== null && value !== 0x7fffffff) {
                if (field.num === 0) lat = fitSemicircleToDegrees(value);
                if (field.num === 1) lon = fitSemicircleToDegrees(value);
              }
            }
            offset += field.size;
          }
          if (Number.isFinite(lat) && Number.isFinite(lon)) points.push([lat, lon]);
          continue;
        }

        const isDefinition = (header & 0x40) !== 0;
        const hasDeveloperData = (header & 0x20) !== 0;
        const localMsgType = header & 0x0f;

        if (isDefinition) {
          if (offset + 5 > dataEnd) break;
          offset += 1;
          const architecture = dv.getUint8(offset); offset += 1;
          const littleEndian = architecture === 0;
          const globalMsgNum = dv.getUint16(offset, littleEndian); offset += 2;
          const numFields = dv.getUint8(offset); offset += 1;
          const fields = [];
          for (let i = 0; i < numFields; i += 1) {
            if (offset + 3 > dataEnd) break;
            const num = dv.getUint8(offset);
            const size = dv.getUint8(offset + 1);
            fields.push({ num, size });
            offset += 3;
          }
          if (hasDeveloperData) {
            if (offset + 1 > dataEnd) break;
            const numDevFields = dv.getUint8(offset);
            offset += 1 + numDevFields * 3;
          }
          definitions.set(localMsgType, { globalMsgNum, littleEndian, fields });
          continue;
        }

        const def = definitions.get(localMsgType);
        if (!def) continue;
        let lat = null;
        let lon = null;
        for (const field of def.fields) {
          if (offset + field.size > dataEnd) { offset = dataEnd; break; }
          if (def.globalMsgNum === 20 && field.size === 4 && (field.num === 0 || field.num === 1)) {
            const value = readSint32(offset, def.littleEndian);
            if (value !== null && value !== 0x7fffffff) {
              if (field.num === 0) lat = fitSemicircleToDegrees(value);
              if (field.num === 1) lon = fitSemicircleToDegrees(value);
            }
          }
          offset += field.size;
        }
        if (Number.isFinite(lat) && Number.isFinite(lon)) points.push([lat, lon]);
      }
      return points;
    };

    const bumpCell = (mapObj, lat, lon, scale) => {
      const ilat = Math.round(lat * scale);
      const ilon = Math.round(lon * scale);
      const key = ilat + ':' + ilon;
      mapObj.set(key, (mapObj.get(key) || 0) + 1);
    };

    const cellToHeatPoint = (key, scale, count) => {
      const parts = key.split(':');
      const lat = Number(parts[0]) / scale;
      const lon = Number(parts[1]) / scale;
      return [lat, lon, Math.min(1, 0.25 + count * 0.04)];
    };

    const toFeature = (points, name) => ({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: points.map((p) => [p[1], p[0]]) },
      properties: { name }
    });

    const formatSeconds = (sec) => {
      if (!Number.isFinite(sec) || sec < 0) return 'N/A';
      const total = Math.round(sec);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      return `${h}h ${m}m ${s}s`;
    };

    const setLoading = (_) => {};
    const drawFromZipBuffer = async (buffer, sourceLabel = 'zip') => {
      lastZipBuffer = buffer;
      lastZipLabel = sourceLabel;
      setLoading(true);
      metaEl.textContent = `解析 ${sourceLabel} 中...`;

      try {
        const zip = await JSZip.loadAsync(buffer);
        let metaMaps = { byId: new Map(), byFilenameStem: new Map() };
        const csvEntry = zip.file('activities.csv');
        if (csvEntry) {
          const csvText = await csvEntry.async('text');
          metaMaps = buildMetaMaps(parseCsv(csvText));
        }
        const entries = Object.values(zip.files).filter((f) => !f.dir && /(^|\/)activities\/.+\.(gpx|fit)(\.gz)?$/i.test(f.name));
        if (!entries.length) {
          metaEl.textContent = '沒找到 activities/*.gpx|*.fit（可含 .gz）。';
          setLoading(false);
          return false;
        }

        const routeFeatures = [];
        const cellCounts = new Map();
        const bounds = L.latLngBounds([]);
        let skippedShort = 0;
        let parsedGpx = 0;
        let parsedFit = 0;
        let parseError = 0;
        let filteredOut = 0;

        for (let i = 0; i < entries.length; i += 1) {
          const e = entries[i];
          metaEl.textContent = `解析中 ${i + 1}/${entries.length}: ${e.name}`;
          let u8 = await e.async('uint8array');
          if (/\.gz$/i.test(e.name)) u8 = pako.ungzip(u8);
          let points = [];
          if (/\.fit(\.gz)?$/i.test(e.name)) {
            points = parseFitPoints(u8);
            if (points.length >= 2) parsedFit += 1;
          } else {
            try {
              const text = new TextDecoder('utf-8').decode(u8);
              points = parseGpxText(text);
              if (points.length >= 2) parsedGpx += 1;
            } catch (_) {
              points = [];
            }
          }
          if (points.length < 2) {
            skippedShort += 1;
            parseError += 1;
            continue;
          }

          const redacted = trimEndByDistance(trimStartByDistance(points, startHideKm), endHideKm);
          if (redacted.length < 2) {
            skippedShort += 1;
            parseError += 1;
            continue;
          }

          const routePts = samplePoints(redacted, 40);
          const heatPts = samplePoints(redacted, 40);
          const stem = stemFromPath(e.name);
          const meta = metaMaps.byId.get(stem) || metaMaps.byFilenameStem.get(stem) || {};
          const actType = String(meta['Activity Type'] || '').trim();
          if (activityTypeFilter === 'cycling' && !isCyclingType(actType)) {
            filteredOut += 1;
            continue;
          }
          if (activityTypeFilter === 'run' && !isRunType(actType)) {
            filteredOut += 1;
            continue;
          }
          const distanceRaw = Number.parseFloat(String(meta.Distance || ''));
          const elevGainRaw = Number.parseFloat(String(meta['Total Elevation Gain'] || ''));
          const elevHighRaw = Number.parseFloat(String(meta['Elevation High'] || ''));
          const movingRaw = Number.parseFloat(String(meta['Moving Time'] || ''));
          const elapsedRaw = Number.parseFloat(String(meta['Elapsed Time'] || ''));
          routeFeatures.push({
            ...toFeature(routePts, String(meta['Activity Name'] || e.name)),
            properties: {
              name: String(meta['Activity Name'] || e.name),
              date: String(meta['Activity Date'] || ''),
              distanceKm: Number.isFinite(distanceRaw) ? distanceRaw / 1000 : Number.NaN,
              elevGainM: Number.isFinite(elevGainRaw) ? elevGainRaw : Number.NaN,
              elevHighM: Number.isFinite(elevHighRaw) ? elevHighRaw : Number.NaN,
              movingSec: Number.isFinite(movingRaw) ? movingRaw : Number.NaN,
              elapsedSec: Number.isFinite(elapsedRaw) ? elapsedRaw : Number.NaN,
            },
          });
          routePts.forEach((p) => bounds.extend([p[0], p[1]]));
          heatPts.forEach((p) => bumpCell(cellCounts, p[0], p[1], 900));
        }

        const heatPoints = Array.from(cellCounts.entries()).map(([k, c]) => cellToHeatPoint(k, 900, c));
        window.__heatBasePoints = heatPoints;

        routeLayer.clearLayers();
        routeLayer.addData({ type: 'FeatureCollection', features: routeFeatures });
        heatLayer.setLatLngs(heatPoints.map((p) => [p[0], p[1], Math.min(1, p[2] * heatGain)]));

        if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });
        metaEl.textContent = `完成：路線 ${routeFeatures.length} 條（GPX ${parsedGpx} / FIT ${parsedFit}），熱點 ${heatPoints.length}；未解析 ${parseError}；類型過濾 ${filteredOut}。`;
        return true;
      } catch (err) {
        metaEl.textContent = `解析失敗：${err && err.message ? err.message : String(err)}`;
        return false;
      } finally {
        setLoading(false);
      }
    };

    const drawFromZipFile = async (file) => {
      if (!file) {
        metaEl.textContent = '請先選擇 zip 檔。';
        return false;
      }
      return drawFromZipBuffer(await file.arrayBuffer(), file.name);
    };

    const loadDemoZipBuffer = async () => {
      const candidates = [
        './demo/ride-demo.zip',
        './web/demo/ride-demo.zip',
        './output/demo/ride-demo.zip',
        '/demo/ride-demo.zip',
        '/web/demo/ride-demo.zip',
        '/output/demo/ride-demo.zip',
      ];
      let lastErr = 'not found';
      for (const p of candidates) {
        try {
          const resp = await fetch(p, { cache: 'no-store' });
          if (!resp.ok) {
            lastErr = `HTTP ${resp.status} @ ${p}`;
            continue;
          }
          const buf = await resp.arrayBuffer();
          return { buffer: buf, path: p };
        } catch (err) {
          lastErr = `${err && err.message ? err.message : String(err)} @ ${p}`;
        }
      }
      throw new Error(lastErr);
    };

    el('zip-input').addEventListener('change', async () => {
      const file = el('zip-input').files && el('zip-input').files[0];
      if (!file) return;
      await drawFromZipFile(file);
    });

    el('demo-btn').addEventListener('click', async () => {
      try {
        metaEl.textContent = '下載 demo 檔案中...';
        const demo = await loadDemoZipBuffer();
        await drawFromZipBuffer(demo.buffer, demo.path);
      } catch (err) {
        metaEl.textContent = `載入 demo 失敗：${err && err.message ? err.message : String(err)}`;
      }
    });

    const openHelpModal = () => {
      helpModalEl.classList.add('open');
      helpModalEl.setAttribute('aria-hidden', 'false');
    };

    const closeHelpModal = () => {
      helpModalEl.classList.remove('open');
      helpModalEl.setAttribute('aria-hidden', 'true');
    };

    el('help-btn').addEventListener('click', openHelpModal);
    el('help-close-btn').addEventListener('click', closeHelpModal);
    helpModalEl.addEventListener('click', (ev) => {
      if (ev.target === helpModalEl) closeHelpModal();
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && helpModalEl.classList.contains('open')) closeHelpModal();
      if (ev.key === 'Escape' && shareOverlayEl.classList.contains('open')) closeShareOverlay();
    });
    [shareDeepTopEl, shareDeepRightEl, shareDeepBottomEl, shareDeepLeftEl].forEach((z) => {
      z.addEventListener('click', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        closeShareOverlay();
      });
    });
    [shareMidTopEl, shareMidRightEl, shareMidBottomEl, shareMidLeftEl].forEach((z) => {
      z.addEventListener('click', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
      });
    });

    const openShareOverlay = () => {
      shareRect = fitRectByRatio(sharePresetRatios[sharePreset] || (4 / 5));
      shareOverlayEl.classList.add('open');
      shareOverlayEl.setAttribute('aria-hidden', 'false');
      shareZonesEl.style.display = 'block';
      if (!shareTexts.length) addTextAt(0.5, 0.88, false);
      updateShareFrame();
    };

    const closeShareOverlay = () => {
      shareOverlayEl.classList.remove('open');
      shareOverlayEl.setAttribute('aria-hidden', 'true');
      shareZonesEl.style.display = 'none';
      shareResize = null;
      shareAddMode = false;
      shareFrameEl.classList.remove('add-mode');
      el('share-add-text-btn').textContent = '+ 新增文字';
    };

    const downloadShareImage = async () => {
      try {
        metaEl.textContent = '產生分享截圖中...';
        const mapRect = el('map').getBoundingClientRect();
        const frameRect = shareFrameEl.getBoundingClientRect();
        const cropX = Math.max(0, frameRect.left - mapRect.left);
        const cropY = Math.max(0, frameRect.top - mapRect.top);
        const cropW = Math.min(mapRect.width - cropX, frameRect.width);
        const cropH = Math.min(mapRect.height - cropY, frameRect.height);

        const baseCanvas = await html2canvas(el('map'), {
          useCORS: true,
          allowTaint: false,
          backgroundColor: null,
          logging: false,
        });

        const out = document.createElement('canvas');
        out.width = Math.max(1, Math.round(cropW));
        out.height = Math.max(1, Math.round(cropH));
        const ctx = out.getContext('2d');
        ctx.drawImage(
          baseCanvas,
          cropX, cropY, cropW, cropH,
          0, 0, out.width, out.height
        );

        shareTexts.forEach((t) => {
          if (!t.text) return;
          const x = clamp((t.x || 0.5), 0, 1) * out.width;
          const y = clamp((t.y || 0.5), 0, 1) * out.height;
          const size = Math.max(10, Math.round((t.size || 24) * (out.width / Math.max(1, shareRect.w))));
          ctx.font = `${t.weight || 700} ${size}px ${t.family || "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"}`;
          ctx.fillStyle = t.color || '#ffffff';
          ctx.textBaseline = 'middle';
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0,0,0,0.7)';
          ctx.shadowBlur = 8;
          const lines = String(t.text).split('\n');
          const lh = Math.round(size * 1.25);
          const yStart = y - ((lines.length - 1) * lh) / 2;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(((t.rotate || 0) * Math.PI) / 180);
          lines.forEach((line, i) => ctx.fillText(line, 0, (yStart + i * lh) - y));
          ctx.restore();
          ctx.shadowBlur = 0;
        });

        const a = document.createElement('a');
        a.href = out.toDataURL('image/png');
        const ts = new Date().toISOString().replace(/[:.]/g, '-');
        a.download = `ride-share-${ts}.png`;
        a.click();
        metaEl.textContent = '分享截圖已下載。';
      } catch (err) {
        metaEl.textContent = `分享截圖失敗：${err && err.message ? err.message : String(err)}`;
      }
    };

    el('share-btn').addEventListener('click', openShareOverlay);
    el('share-close-btn').addEventListener('click', closeShareOverlay);
    el('share-download-btn').addEventListener('click', downloadShareImage);
    window.addEventListener('resize', () => {
      if (!shareOverlayEl.classList.contains('open')) return;
      shareRect = clampShareRect(shareRect);
      updateShareFrame();
    });

    updateLabels();
    updateShareFrame();
  </script>
</body>
</html>
